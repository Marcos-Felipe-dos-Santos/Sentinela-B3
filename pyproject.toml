[tool.mutmut]
# Layout plano: os módulos ficam na raiz. Fora da mutação: tests/, venv/, backtesting/.
source_paths = [
    "ai_core.py",
    "brapi_provider.py",
    "config.py",
    "cvm_fii_map.py",
    "cvm_fii_provider.py",
    "cvm_provider.py",
    "cvm_ticker_map.py",
    "data_quality.py",
    "database.py",
    "fii_engine.py",
    "fundamentus_scraper.py",
    "market_engine.py",
    "peers_engine.py",
    "portfolio_engine.py",
    "technical_engine.py",
    "valuation_engine.py",
    "sentinela/",
]
also_copy = ["app.py", "auditoria.py", "auditar_recomendacoes.py", "limpar_banco.py", "backtesting/", "scripts/", "pytest.ini"]
# Com xfail_strict ligado, um XPASS acidental conta como mutante morto: só na mutação ele é desligado.
# O código instrumentado do mutmut importa pathlib e urllib: o teste de import isolado do F1-10 não vale na mutação (a AST vale).
pytest_add_cli_args = ["-o", "xfail_strict=False", "--deselect", "tests/test_contratos_import.py::test_import_isolado_nao_carrega_modulos_proibidos"]
pytest_add_cli_args_test_selection = ["tests/"]
