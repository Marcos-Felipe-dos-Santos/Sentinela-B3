[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
xfail_strict = true
markers =
    preservar: seção A do test_financeiro_pre_refactor — comportamento que deve sobreviver ao refactor
    quebra_esperada: seção B — caracteriza comportamento atual que deve mudar (cada teste cita o achado)
    invariante: seção C — invariantes que valem antes e depois
    f4_gordon_nominal: F-4 — Gordon desconta pela Selic nominal
    f9_fii_selic: F-9 — valuation de FII sem ancoragem patrimonial, comparado só com a Selic líquida
    f12_alavancagem_total: F-12 — alavancagem medida pelo endividamento contábil total
    f15_markowitz_um_ano: F-15 — Markowitz com um ano de dados e divisão fixa 40/60
